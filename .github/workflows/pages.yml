name: 共通トップと両ゲームを公開

on:
  push:
    branches: [main]
    paths:
      - index.html
      - portal/**
      - tools/build-portal.mjs
      - dqb3-tsugumono-ch1-3/**
      - dqb3-tsugumono-ch4-5/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            dqb3-tsugumono-ch1-3/package-lock.json
            dqb3-tsugumono-ch4-5/package-lock.json
      - name: 両ゲームの依存関係を準備
        run: |
          npm --prefix dqb3-tsugumono-ch1-3 ci
          npm --prefix dqb3-tsugumono-ch4-5 ci
      - name: 共通トップと両ゲームをビルド
        id: build
        run: node tools/build-portal.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build.outputs.path }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
