name: 共通トップと両ゲームを公開

on:
  push:
    branches: [main]
    paths:
      - index.html
      - portal/**
      - tools/build-portal.mjs
      - tools/serve-portal.mjs
      - game-shared/**
      - dqb3-tsugumono-ch1-3/**
      - dqb3-tsugumono-ch4-5/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            dqb3-tsugumono-ch1-3/package-lock.json
            dqb3-tsugumono-ch4-5/package-lock.json
      - name: 両ゲームの依存関係を準備
        run: |
          npm --prefix dqb3-tsugumono-ch1-3 ci
          npm --prefix dqb3-tsugumono-ch4-5 ci
      - name: 共通トップと両ゲームをビルド
        id: build
        run: node tools/build-portal.mjs
      - name: 公開用ビルドで両編の設計図を確認
        timeout-minutes: 8
        env:
          PORTAL_BUILD: ${{ steps.build.outputs.path }}
        run: |
          node tools/serve-portal.mjs "$PORTAL_BUILD" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          base=http://127.0.0.1:5188/DBQ3_shoku-wo-tsugu-mono
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 "$base/" --output /dev/null
          for game in dqb3-tsugumono-ch1-3 dqb3-tsugumono-ch4-5; do
            BASE_URL="$base/$game/" node "$game/tests/e2e/blueprint.test.mjs"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build.outputs.path }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
