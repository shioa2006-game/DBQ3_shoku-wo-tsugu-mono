<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#13282c" />
    <meta name="description" content="ブラウザーで遊ぶブロックメイクRPG「職をつぐ者」。ジパング復興編・火山島編・ダーマ再興編の共通トップページ。" />
    <title>職をつぐ者 — 冒険を選ぶ</title>
    <link rel="icon" href="./portal/images/emblem.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./portal/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#chapters">冒険を選ぶ</a>
    <main>
      <header class="hero">
        <p class="homage">ドラゴンクエストビルダーズ・オマージュ</p>
        <h1>職をつぐ者</h1>
      </header>

      <section class="chapters" id="chapters" aria-labelledby="chapters-title">
        <h2 id="chapters-title">冒険を選ぶ</h2>
        <div class="chapter-grid">
          <article class="chapter" aria-labelledby="zipangu-title">
            <div class="chapter-art chapter-art--zipangu">
              <img src="./portal/images/zipangu-gameplay.png" width="1916" height="940" alt="ジパングの森と岩山を背景に、砂の足場に立つ主人公のゲーム画面" />
            </div>
            <div class="chapter-content">
              <p class="chapter-number">第1〜3章</p>
              <h3 id="zipangu-title">ジパング復興編</h3>
              <p class="chapter-description">家と畑をつくり、島の暮らしを取り戻す。</p>
              <a class="play-link" href="./dqb3-tsugumono-ch1-3/" aria-label="ジパング復興編のタイトル画面へ">この編を遊ぶ</a>
            </div>
          </article>

          <article class="chapter" aria-labelledby="volcano-title">
            <div class="chapter-art">
              <img src="./portal/images/volcano.svg" width="720" height="440" alt="火山のふもとの鍛冶場と、竹林へ続く道を描いたイラスト" />
              <span class="art-caption">イメージ</span>
            </div>
            <div class="chapter-content">
              <p class="chapter-number">第4〜5章</p>
              <h3 id="volcano-title">火山島編</h3>
              <p class="chapter-description">鍛冶と癒やしの力で、火山島を復興する。</p>
              <a class="play-link" href="./dqb3-tsugumono-ch4-5/" aria-label="火山島編のタイトル画面へ">この編を遊ぶ</a>
            </div>
          </article>

          <article class="chapter" aria-labelledby="dharma-title">
            <div class="chapter-art">
              <img src="./portal/images/dharma.svg" width="720" height="440" alt="海岸から山へ続く道と、山腹の大きな神殿を描いた構想イラスト" />
              <span class="art-caption">構想イメージ</span>
            </div>
            <div class="chapter-content">
              <p class="chapter-number">第6〜7章</p>
              <h3 id="dharma-title">ダーマ再興編</h3>
              <p class="chapter-description">神殿を再建し、仲間とともに守り抜く。</p>
              <button class="play-link coming-soon" type="button" disabled>準備中</button>
            </div>
          </article>
        </div>
      </section>
    </main>
    <footer class="site-footer">PC・キーボード／マウス対応</footer>
  </body>
</html>
